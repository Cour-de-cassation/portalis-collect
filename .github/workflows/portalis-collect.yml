name: Code quality portalis-collect

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test
